<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Dailies</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbfbfa; color: #14201a; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 420px; padding: 32px 24px; text-align: center; }
      h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { color: #646d67; margin: 0 0 24px; }
      a { display: inline-block; padding: 12px 20px; border-radius: 8px; background: #1e3a2c; color: #f4f1ea; text-decoration: none; font-weight: 600; }
      @media (prefers-color-scheme: dark) { body { background: #111713; color: #eef1ee; } p { color: #9aa59e; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>That link doesn't go anywhere. It may have a typo, or the page moved.</p>
      <a href="/">Go to the homepage</a>
    </main>
  </body>
</html>
